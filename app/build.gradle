plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahusan.webapps'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ahusan.webapps'
        minSdk 21
        targetSdk 34
        // CI sets APP_VERSION to the build number, matching the release tag v1.0.N
        def buildNo = (System.getenv('APP_VERSION') ?: '1').toInteger()
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    // Fixed key committed to the repo so every new build installs over the old one.
    signingConfigs {
        release {
            storeFile file('webapps.jks')
            storePassword 'webapps123'
            keyAlias 'webapps'
            keyPassword 'webapps123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
