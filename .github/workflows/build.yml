name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Download ad / adult block lists
        run: bash scripts/fetch-blocklists.sh

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        env:
          APP_VERSION: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WebAppsTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WebAppsTV
          path: WebAppsTV.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Web Apps TV v1.0.${{ github.run_number }}
          files: WebAppsTV.apk
          body: ${{ github.event.head_commit.message }}
